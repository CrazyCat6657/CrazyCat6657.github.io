<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双人联机实验室 · 游戏中心</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="network.css"></head><body>
<header class="topbar"><a class="brand" href="../index.html">← 游戏中心</a><span class="lab-label">双人联机实验室 · 测试版</span></header>
<main class="lab"><section class="lab-intro"><p class="eyebrow">先和朋友碰个面</p><h1>一人开房，<br>一人来战。</h1><p>这是用于验证联机的小型对决。双方准备后开局，先拿到 3 分获胜。<br>《相位裂隙》与《沉钟回廊》的联机玩法仍在后续计划中。</p></section>
<section class="lab-layout"><aside class="room-panel"><p id="connection" role="status">尚未连接</p><div id="entrance"><button class="button" id="create">创建双人房间 <span>＋</span></button><div class="or">或用朋友的邀请码加入</div><p id="join-hint" class="join-hint" hidden></p><form id="join-form"><label for="code">邀请码</label><div class="join-row"><input id="code" maxlength="6" placeholder="六位邀请码" autocomplete="off" autocapitalize="characters" spellcheck="false" required pattern="[A-HJ-NP-Za-hj-np-z2-9]{6}"><button class="button secondary" type="submit">加入</button></div></form></div>
<div id="room-controls" hidden><p class="field-label">房间邀请码</p><div class="room-code" id="room-code"></div><button class="text-button" id="copy">复制邀请链接</button><input id="invite-url" class="invite-url" readonly aria-label="完整邀请链接" title="复制完整链接发给朋友"><ul id="players" class="player-list"></ul><div class="room-buttons"><button class="button" id="ready">准备</button><button class="button secondary" id="start" disabled>开始对局</button><button class="text-button" id="leave">离开房间</button></div></div>
<p class="feedback" id="feedback" role="status" aria-live="polite"></p><p class="latency" id="latency"></p>
<details class="server-setting"><summary>连接设置</summary><label for="server-url">联机服务地址</label><input id="server-url" placeholder="wss://你的服务地址/socket" type="url"><button class="text-button" id="save-server">保存地址</button><p>本机预览默认连接本地服务。异地联机需要先部署服务并配置安全连接。</p></details></aside>
<div class="arena-panel"><div class="arena-bar"><strong id="match-state">等待玩家</strong><span id="score">0 : 0</span><span id="time">2:00</span></div><canvas id="arena" width="960" height="600" tabindex="0" aria-label="双人对决画面，WASD 移动，鼠标瞄准，按住左键射击"></canvas><p class="arena-help">WASD / 方向键移动 · 鼠标瞄准 · 按住左键射击 · 切换窗口会停止操作</p></div></section>
<p class="lab-footnote">两人各开一个浏览器窗口即可本机体验。当前页面不会读取单人游戏进度。</p></main><script type="module" src="app.mjs"></script></body></html>
